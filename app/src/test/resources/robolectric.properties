# The SDK level the framework tests run against, which is not the one the app is built for.
#
# 35 is the newest level Robolectric's own runtime carries here. At 36 the framework does not finish
# starting, let alone run a test body: `com.android.internal.os.ApplicationSharedMemory` reaches
# into `java.io.FileDescriptor` and the interceptor that stands in for it no longer matches the JRE.
# Nothing these tests cover reads a platform behavior that differs across those levels -- the work
# is `android.text.Html`'s span building -- so the pin costs them nothing.
sdk=35
